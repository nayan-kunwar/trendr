global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
# Prometheus refuses to expand environment variables inside config files
# (prometheus/prometheus#2357), so Compose renders METRICS_TOKEN into a
# read-only file with `configs.content` and the scrape jobs read it here.
# Neither the token nor a `${VAR}` placeholder is committed.
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics.token }
    static_configs: [{ targets: ['api:4000'] }]
  - job_name: worker
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics.token }
    static_configs: [{ targets: ['worker:9464'] }]
