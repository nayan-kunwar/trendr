# Trendr production reverse proxy (spec §15/§17.1, task 10.1).
#
# TLS terminates here with a Cloudflare Origin Certificate. Cloudflare proxies
# the public hostname to this origin on 443 (Full (strict)); port 80 only
# redirects to HTTPS.
#
# Certificates are mounted read-only from ./infra/nginx/certs:
#   origin.pem      Cloudflare Origin Certificate
#   origin-key.pem  matching private key
#
# Routes:
#   /v1/*     -> api:4000   (JSON API; /v1/stream/* is SSE)
#   /mcp*     -> mcp:4100   (streamable HTTP MCP; bearer tokens required)
#   /readyz   -> api:4000   (deployment acceptance probe)
#   /healthz  -> nginx      (container healthcheck only)
#   /         -> web:3000   (Next.js)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Query strings are deliberately excluded: magic-link, unsubscribe and OAuth
# callback URLs carry one-time secrets. `$uri` keeps the route visible without
# writing a replayable credential to disk or a log collector. Referer is also
# omitted for the same reason (a same-origin asset request can carry the page
# URL in Referer).
log_format trendr escape=json '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                              '"$http_user_agent"';

# M-2: edge flood guard. The API authenticates an X-API-Key header before its
# own rate limiter sees the request, so the first line of defence for a burst
# of distinct keys lives here: 50 r/s per peer with a 100-request burst, and at
# most 20 concurrent connections from one peer. Both answer 429 like the API.
limit_req_zone $binary_remote_addr zone=api_req:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# H-1: `$realip_remote_addr` is the peer address before real_ip rewriting, so a
# caller-supplied CF-Connecting-IP cannot make a direct connection look like
# Cloudflare. Loopback stays allowed for the container healthcheck and a local
# Cloudflare Tunnel sidecar; add that container's subnet if you run one.
geo $realip_remote_addr $cloudflare_edge {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    include /etc/nginx/cloudflare/nginx-geo.conf;
}

upstream trendr_api {
    server api:4000;
    keepalive 32;
}

upstream trendr_web {
    server web:3000;
    keepalive 32;
}

upstream trendr_mcp {
    server mcp:4100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log /var/log/nginx/access.log trendr;

    # H-1: the origin only serves Cloudflare's edge.
    if ($cloudflare_edge = 0) {
        return 444;
    }

    # Container healthcheck and load-balancer liveness only.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log trendr;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare forwards the real client in CF-Connecting-IP. Trusting only
    # Cloudflare's published ranges keeps direct-to-origin requests from
    # spoofing their address (and therefore API rate-limit buckets). The list
    # is generated by infra/scripts/refresh-cloudflare-ips.sh from
    # https://www.cloudflare.com/ips/ and refreshed by a weekly timer.
    include /etc/nginx/cloudflare/nginx-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    # H-1: reject connections that did not arrive through Cloudflare. 444 closes
    # the connection without a response, so direct scans learn nothing.
    if ($cloudflare_edge = 0) {
        return 444;
    }

    server_tokens off;

    # Spec §15: request bodies are capped at 64 KB (Fastify enforces the same
    # limit; nginx rejects oversized bodies before they reach Node).
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # nginx is the only proxy in front of the API, so overwrite rather than
    # append the forwarded chain: a client-supplied X-Forwarded-For must never
    # become the rate-limit identity.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        proxy_pass http://trendr_api;
    }

    # SSE: no buffering, no compression, and a long read timeout so long-lived
    # leaderboard streams survive idle periods (spec §9.3).
    location /v1/stream/ {
        proxy_pass http://trendr_api;
        # Long-lived streams: cap raw sockets but do not rate-limit the body.
        limit_conn api_conn 10;
        limit_conn_status 429;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://trendr_api;
        limit_req zone=api_req burst=100 nodelay;
        limit_req_status 429;
        limit_conn api_conn 20;
        limit_conn_status 429;
    }

    # MCP streamable HTTP uses SSE responses too.
    location /mcp {
        proxy_pass http://trendr_mcp;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://trendr_web;
        # A location that sets any proxy_set_header stops inheriting the
        # server-level block, so repeat the common headers here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Next.js production does not need WebSockets, but keeping the upgrade
        # headers makes the proxy safe for future live-reload/tooling routes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
