# CI (spec §17.4), adapted to the current repo state:
#  - Unit/int suites run through the root Vitest workspace (`pnpm test` / `pnpm test:int`);
#    the spec's `pnpm turbo run test` would be a no-op until packages define per-package
#    test scripts, and per-package Vitest runs would re-run the whole suite N times.
#  - The OpenAPI-export step arrives with Phase 3 (3.1), the compose-smoke seed step with
#    Phase 3 (3.7), and the nightly contract job with Phase 5 (5.6).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly slot reserved for the Phase 5 contract job
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: '**/coverage/coverage-summary.json' }

  integration:
    runs-on: ubuntu-latest # Docker is available → Testcontainers works out of the box
    timeout-minutes: 20
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: pnpm test:int
        env: { TESTCONTAINERS_RYUK_DISABLED: 'false' }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # The one-shot `migrate` service exits 0 and modern Compose `--wait` accepts that
      # (verified locally on Compose v5.4). If a runner's Compose disagrees, run
      # `docker compose run --rm migrate` first (spec §17.4 note).
      - run: docker compose up -d --build --wait --wait-timeout 300 postgres redis migrate api worker web mcp
      - run: curl -fsS http://localhost:4000/readyz && curl -fsS http://localhost:3000 >/dev/null
      - name: Worker health (port 9464 is not published; check inside the container)
        run: docker compose exec -T worker node -e "fetch('http://localhost:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      # Seed + trending-assertion step arrives with Phase 3 (3.7).
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
