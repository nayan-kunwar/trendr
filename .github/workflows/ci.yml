# CI (spec §17.4), adapted to the current repo state:
#  - Unit/int suites run through the root Vitest workspace (`pnpm test` / `pnpm test:int`);
#    the spec's `pnpm turbo run test` would be a no-op until packages define per-package
#    test scripts, and per-package Vitest runs would re-run the whole suite N times.
#  - The nightly contract job (spec §16) probes the six live upstreams and opens an
#    issue when an upstream schema drifts; it never runs on pull requests.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly contract probes
  workflow_dispatch:
  # M-9: the publish workflow calls this file as a reusable gate, so an image
  # can only be built from a commit whose full CI matrix is green.
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck
      - run: pnpm test:coverage
      - name: OpenAPI up to date
        run: pnpm --filter @trendr/api openapi:export && git diff --exit-code apps/api/openapi.json
      - name: Prometheus alert rules
        run: |
          docker run --rm \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 \
            check rules /etc/prometheus/alerts.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: '**/coverage/coverage-summary.json' }

  integration:
    runs-on: ubuntu-latest # Docker is available → Testcontainers works out of the box
    timeout-minutes: 20
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: pnpm test:int
        env: { TESTCONTAINERS_RYUK_DISABLED: 'false' }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      # gitleaks-action@v2 derives its range as `<first-pushed-commit>^..HEAD`, which cannot
      # resolve on a repository whose first commit is a root commit (R-11). Run the pinned
      # CLI over the full history instead; `.gitleaks.toml` supplies the verified allowlist.
      - name: gitleaks
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --redact -v --exit-code=1 \
            --report-format=sarif --report-path=results.sarif
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: gitleaks-sarif, path: results.sarif }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Origin ingress policy (H-1)
        run: bash infra/scripts/verify-origin-ingress.sh
      - run: cp .env.example .env
      # The one-shot `migrate` service exits 0 and modern Compose `--wait` accepts that
      # (verified locally on Compose v5.4). If a runner's Compose disagrees, run
      # `docker compose run --rm migrate` first (spec §17.4 note).
      - run: docker compose up -d --build --wait --wait-timeout 300 postgres redis migrate api worker web mcp mailpit
      - run: curl -fsS http://localhost:4000/readyz && curl -fsS http://localhost:3000 >/dev/null
      - name: Security headers (spec §15, task 9.3)
        run: |
          curl -fsS -o /dev/null -D - http://localhost:3000/login > web-headers.txt
          grep -qi "content-security-policy:.*'nonce-" web-headers.txt
          grep -qi 'x-content-type-options: nosniff' web-headers.txt
          curl -fsS -o /dev/null -D - http://localhost:4000/healthz > api-headers.txt
          grep -qi "content-security-policy:.*default-src 'none'" api-headers.txt
          grep -qi 'x-content-type-options: nosniff' api-headers.txt
      - name: Account smoke (Mailpit)
        run: node scripts/auth-smoke.mjs
      - name: Worker health (port 9464 is not published; check inside the container)
        run: docker compose exec -T worker node -e "fetch('http://localhost:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      # Spec §17.4 — seed, then assert trending. The spec snippet asserts immediately
      # after seeding, but boards only exist after a scoring run (the score-safety
      # scheduler is hourly), so the task 2.6 admin-less CLI (score-cli lives in the
      # worker image) triggers one and the assertion polls briefly for the board.
      - name: Seed, score, trending assertion
        run: |
          docker compose exec -T api node packages/db/dist/seed.js
          docker compose exec -T worker node dist/score-cli.js --source github
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:4000/v1/trending?scope=all&window=7d" | jq -e '.data | length > 0'; then
              exit 0
            fi
            sleep 2
          done
          echo "trending assertion failed after 60 s" >&2
          exit 1
      - name: MCP tools smoke
        run: node scripts/mcp-smoke.mjs
      - name: Observability profile smoke
        run: |
          docker compose --profile obs up -d prometheus grafana
          node scripts/obs-smoke.mjs
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: compose-logs, path: compose.log }

  contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Live upstream schema probes
        run: pnpm --filter @trendr/sources test:contract
        env:
          CONTRACT: '1'
          # GitHub reserves the GITHUB_ prefix for secret names; the workflow
          # maps the repo secret into the env var the adapters read.
          GITHUB_TOKENS: ${{ secrets.TRENDR_GITHUB_TOKENS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Nightly contract tests failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The real-upstream contract probes failed on ${new Date().toISOString()}.\n\n${runUrl}`;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = data.items[0];
            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            }
