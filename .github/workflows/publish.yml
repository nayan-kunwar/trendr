# Build and publish the four runtime images to GHCR (spec §17.1, task 10.1).
#
# Release path: push a semver tag (`git tag v1.0.0 && git push origin v1.0.0`).
# Manual runs publish `edge` and the commit-sha tag for smoke testing.
#
# The Next.js image bakes NEXT_PUBLIC_API_URL at build time, so the repository
# variable `API_PUBLIC_URL` must be set (Settings → Secrets and variables →
# Actions → Variables) before publishing web. Keep it identical to the value in
# the server's .env.production.
#
# Main-branch publishing is intentionally not enabled yet: it would fail every
# push until API_PUBLIC_URL exists. Add `branches: [main]` under `push` once the
# variable is configured.
name: Publish images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-node:
    name: publish-${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, mcp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trendr-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.app }}

  publish-web:
    name: publish-web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require API_PUBLIC_URL
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          if [ -z "$API_PUBLIC_URL" ]; then
            echo "::error::Set the API_PUBLIC_URL repository variable before publishing the web image."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trendr-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
