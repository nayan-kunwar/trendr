version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates arrive grouped; they are version bumps.
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
      # Production majors are rare enough that one grouped PR is a readable
      # unit (the ioredis 6 + Next 16 pair landed as a single migration).
      production-major:
        dependency-type: production
        update-types: [major]
      # No development-major group on purpose: dev majors are migrations, not
      # version bumps. A twelve-package group bundled TypeScript 7 (which
      # typescript-eslint rejects) with six unrelated upgrades and produced a
      # failure with no attributable cause. See docs/TOOLCHAIN_UPGRADES.md.
    ignore:
      # The runtime is Node 22; @types/node majors track newer Node lines and
      # would let the code compile against APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # Minor/patch action bumps arrive together; a major (v4 → v7) arrives alone
    # because it can change inputs, the Node runtime or credential handling.
    groups:
      actions-minor:
        patterns: ['*']
        update-types: [minor, patch]
