# gitleaks configuration (spec §15: CI runs gitleaks on every PR and push).
# Extends the default rules; allowlists exist only for verified false positives.

[extend]
useDefault = true

# Verified false positive (Fingerprint c3d9b52:…:generic-api-key): in `.env.example`
# and the spec's verbatim env template an empty `HF_TOKEN=` is followed by
# `HF_RATE_PER_5MIN=1000`; the generic-api-key rule's multi-line match then captures
# that next line as the "secret". No token value is present in either file.
[[allowlists]]
description = 'placeholders: empty HF_TOKEN= directly before another KEY= line'
regexTarget = "match"
regexes = ["HF_TOKEN=\n"]

# Verified false positives (Fingerprint ac3ce4b:apps/worker/test/int/scoring-queue.int.test.ts:
# generic-api-key:61-63): the scoring int test spawns the `worker:score` CLI with a
# fabricated env — `JWT_SECRET`, `API_KEY_PEPPER` and `UNSUBSCRIBE_SECRET` are literal
# `int-test-*` strings that exist only for that child process. No credential material;
# allowlist the fixture prefix rather than the file, so real secrets are still caught.
[[allowlists]]
description = 'fixtures: fabricated int-test-* CLI env values in the scoring int test'
regexTarget = "match"
regexes = ['''int-test-[a-z0-9-]+''']

# Verified false positives (Fingerprint 0c7de0b:…:generic-api-key): the API-key format
# tests build `dt_live_<prefix>_<suffix>` fixtures whose suffix is the literal repeating
# pattern `abcdef0123456789abcdef0123456789` (`packages/core/src/api-keys.test.ts` and
# `apps/api/test/int/api-key.int.test.ts`). It is fabricated test data, never a credential;
# allowlisting the literal keeps every other generic-api-key hit visible.
[[allowlists]]
description = 'fixtures: fabricated API-key suffix used by the api-key tests'
regexTarget = "match"
regexes = ['''abcdef0123456789abcdef0123456789''']
