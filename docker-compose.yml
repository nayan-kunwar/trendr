name: trendr

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://trendr:trendr@postgres:5432/trendr
  REDIS_URL: redis://redis:6379
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  API_INTERNAL_URL: http://api:4000
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab # set TIMESCALE_ENABLED=true and image timescale/timescaledb:latest-pg16 for the Timescale variant
    command: ['postgres', '-c', 'timezone=UTC'] # partition + rollup math assumes UTC sessions (6.3); prod override adds -c shared_buffers=256MB
    environment:
      POSTGRES_USER: trendr
      POSTGRES_PASSWORD: trendr
      POSTGRES_DB: trendr
    ports: ['127.0.0.1:5432:5432'] # loopback only: never publish the dev database
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trendr -d trendr']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction'] # BullMQ requires noeviction
    ports: ['127.0.0.1:6379:6379'] # loopback only: Redis has no authentication
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    command: ['node', 'packages/db/dist/migrate.js']
    environment: { <<: *node-env }
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      <<: *node-env
      API_PORT: '4000'
      SMTP_URL: smtp://mailpit:1025
    env_file: [.env]
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: worker } }
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      <<: *node-env
      WORKER_ROLES: scheduler,ingest,scoring,notify
      WORKER_METRICS_PORT: '9464'
      SMTP_URL: smtp://mailpit:1025
    env_file: [.env]
    expose: ['9464'] # internal only: Prometheus scrapes worker:9464; /metrics needs Bearer METRICS_TOKEN
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9464/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      PORT: '3000'
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  mcp:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: mcp } }
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      <<: *node-env
      MCP_TRANSPORT: http
      MCP_PORT: '4100'
    env_file: [.env]
    ports: ['127.0.0.1:4100:4100'] # loopback only; production must set MCP_HTTP_AUTH_TOKENS
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports: ['8025:8025', '1025:1025']

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: ['obs']
    # Prometheus has no config-file env expansion (governance vote,
    # prometheus/prometheus#2357), so the bearer token is rendered into a
    # read-only file at `docker compose config` time instead.
    configs: [{ source: metrics_token, target: /etc/prometheus/metrics.token }]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    profiles: ['obs']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    profiles: ['obs']
    ports: ['16686:16686', '4318:4318']

volumes:
  pgdata:
  redisdata:

# Rendered from the same `.env` METRICS_TOKEN the API/worker read via `env_file`,
# mounted read-only into Prometheus for the two scrape jobs (spec §14.5).
configs:
  metrics_token:
    content: ${METRICS_TOKEN:-change-me-metrics-token}
